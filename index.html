<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физика: тренажёр к экзамену</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1b1f24; --muted:#5a6572; --line:#dde1e6;
  --accent:#1565c0; --accent-ink:#ffffff; --accent-soft:#e6f0fb;
  --ok:#2e7d32; --ok-bg:#e8f5e9; --bad:#c62828; --bad-bg:#fdecea;
  --warn:#8a5a00; --warn-bg:#fff4dc; --formula-bg:#fff8e6; --formula-line:#f0d28a;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --card:#1d2227; --ink:#e8ebee; --muted:#9aa5b1; --line:#323a43;
    --accent:#6aa9f0; --accent-ink:#0d1b2a; --accent-soft:#1d2c3d;
    --ok:#66bb6a; --ok-bg:#1b2d1e; --bad:#ef7a72; --bad-bg:#341d1c;
    --warn:#e8b04a; --warn-bg:#35290f; --formula-bg:#2a2616; --formula-line:#5a4d22;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b; --card:#1d2227; --ink:#e8ebee; --muted:#9aa5b1; --line:#323a43;
  --accent:#6aa9f0; --accent-ink:#0d1b2a; --accent-soft:#1d2c3d;
  --ok:#66bb6a; --ok-bg:#1b2d1e; --bad:#ef7a72; --bad-bg:#341d1c;
  --warn:#e8b04a; --warn-bg:#35290f; --formula-bg:#2a2616; --formula-line:#5a4d22;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 64px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 8px}
header.top a.brand{font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;margin-right:auto}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;text-decoration:none;cursor:pointer;min-height:40px}
nav.tabs a:hover,.btn:hover{border-color:var(--accent)}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
h1{font-size:26px;line-height:1.25;margin:12px 0 4px}
h2{font-size:20px;margin:28px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(3,1fr)}
.grid.topics{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{text-align:center}
.tile b{display:block;font-size:30px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--ok)} .bar .l{background:#e0a21b} .bar .w{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.topic-card{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-decoration:none;color:inherit}
.topic-card:hover{border-color:var(--accent)}
.topic-card .n{font-size:13px;color:var(--muted)}
.topic-card .t{font-weight:600}
.qlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.qlist li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer}
.qlist li:hover{border-color:var(--accent)}
.qlist .no{min-width:52px;font-weight:600;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)} .dot.learning{background:#e0a21b;border-color:#e0a21b} .dot.weak{background:var(--bad);border-color:var(--bad)}
details.tpl{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;padding:0}
details.tpl summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
details.tpl summary::-webkit-details-marker{display:none}
details.tpl summary:before{content:"▸ ";color:var(--accent)}
details.tpl[open] summary:before{content:"▾ "}
details.tpl .in{padding:0 14px 14px}
.formula{background:var(--formula-bg);border:1px solid var(--formula-line);border-radius:8px;padding:6px 10px;margin:6px 0;font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif;font-size:17px;overflow-x:auto}
.rule{margin:8px 0 0;color:var(--ink)}
.qs{font-size:13px;color:var(--muted);margin-top:8px}
.tplbox{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:10px 0}
.tplbox .h{font-weight:600;margin-bottom:2px}
.note{border-left:4px solid #e0a21b;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0}
.runhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pill{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted)}
.qtitle{font-size:18px;font-weight:600;margin:6px 0 10px}
.imgbox{overflow-x:auto;border-radius:10px}
img.qimg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.imgbox.zoomed img.qimg{width:190%;max-width:none;cursor:zoom-out}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.opt{min-width:56px;height:52px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:19px;font-weight:600;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt[disabled]{cursor:default}
.hint{font-size:13px;color:var(--muted);margin:4px 0}
.verdict{border-radius:10px;padding:10px 14px;font-weight:600;margin:10px 0}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.score{font-size:48px;font-weight:700;line-height:1}
.checks label{display:flex;gap:10px;align-items:center;padding:6px 0}
.checks input{width:20px;height:20px}
.foot{margin-top:36px;font-size:13px;color:var(--muted)}
a{color:var(--accent)}
.thbody{white-space:pre-line;line-height:1.65}
.toc a{text-decoration:none}
details.tpl[id]{scroll-margin-top:12px}
h2[id]{scroll-margin-top:12px}
.formula .katex-display{margin:0;text-align:left}
.formula .katex-display>.katex{text-align:left}
.formula .katex{font-size:1.12em}
.formula.ftext{font-family:inherit;font-size:16px}
.tex .katex{font-size:1.08em}
.stem{font-size:17px;white-space:pre-line;margin:4px 0 8px}
img.fig{display:block;max-width:100%;height:auto;margin:4px 0 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.solbox{white-space:pre-line;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--card)}
.opts.text{flex-direction:column}
.opt.optrow{display:flex;gap:12px;align-items:flex-start;justify-content:flex-start;text-align:left;width:100%;height:auto;min-height:48px;padding:10px 14px;font-size:16px;font-weight:400}
.optrow b{min-width:22px;font-weight:700}
@media (max-width:600px){
  .imgbox:not(.zoomed) img.qimg{width:165%;max-width:none}
  .imgbox.zoomed img.qimg{width:100%}
}
@media (max-width:560px){
  .grid.stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .tile b{font-size:24px}
  h1{font-size:22px}
  .imgbox{margin-left:-6px;margin-right:-6px}
}
@media print{
  header.top,.noprint,.foot{display:none!important}
  body{background:#fff;color:#000}
  details.tpl{break-inside:avoid}
  details.tpl:not([open]) .in{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/">Физика · тренажёр</a>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app"></main>
  <div class="foot noprint">Прогресс хранится в браузере этого устройства. Картинки условий и решений взяты из файла «Вопросы с подробными решениями».</div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="data.js"></script>
<script src="images.js"></script>
<script src="teoriya.js"></script>
<script src="voprosy-dop.js"></script>
<script>
(function(){
"use strict";
const Q = DATA.questions, TOP = DATA.topics, TPL = DATA.templates;
const LOADERR = [];   // ошибки в voprosy-dop.js показываем на главной, а не роняем сайт
// Теория (teoriya.js): если файла нет, вкладка просто пустая
const TH = (typeof THEORY !== "undefined") ? THEORY : [];
const THSEC = {}; TH.forEach(t => t.sections.forEach(s => { s.topic = t.topic; THSEC[s.id] = s; }));

/* ---------- новые вопросы из voprosy-dop.js ---------- */
(function mergeExtra(){
  const EX = window.EXTRA || {};
  (EX.templates || []).forEach(t => {
    if (!t || !t.id || TPL.some(x => x.id === t.id)){ LOADERR.push("Шаблон «" + (t && t.id) + "»: пустой id или такой id уже есть"); return; }
    t.qids = t.qids || []; t.formulas = t.formulas || []; t.rule = t.rule || ""; TPL.push(t);
  });
  (EX.questions || []).forEach(q => {
    const bad = r => LOADERR.push("Вопрос " + (q && q.id) + ": " + r);
    if (!q || !Number.isInteger(q.id)) return bad("нужен целый номер id");
    if (Q.some(x => x.id === q.id)) return bad("такой id уже есть");
    const top = TOP.find(t => t.id === q.topic); if (!top) return bad("нет темы " + q.topic);
    if (!q.stem || !Array.isArray(q.options) || q.options.length < 2 || q.options.length > 8) return bad("нужны stem и от 2 до 8 вариантов options");
    if (!Array.isArray(q.answer) || !q.answer.length || q.answer.some(p => !Number.isInteger(p) || p < 1 || p > q.options.length)) return bad("answer — номера вариантов, начиная с 1");
    q.n = q.options.length; q.ans = q.answer; q.num = false;
    q.title = q.title || ("Вопрос " + q.id);
    q.tpl = (q.tpl || []).filter(tid => TPL.some(x => x.id === tid));
    Q.push(q); top.qids.push(q.id);
    (q.th || []).forEach(sid => { const s = THSEC[sid]; if (s && !s.qids.includes(q.id)) s.qids.push(q.id); });
    q.tpl.forEach(tid => { const t = TPL.find(x => x.id === tid); if (!t.qids.includes(q.id)) t.qids.push(q.id); });
  });
})();

const byId = {}; Q.forEach(q => byId[q.id] = q);
const tplById = {}; TPL.forEach(t => tplById[t.id] = t);
const topById = {}; TOP.forEach(t => topById[t.id] = t);
const ORDER = []; TOP.forEach(t => t.qids.forEach(id => ORDER.push(id)));
const LET = "abcdefgh";

/* ---------- хранилище ---------- */
// KEY не менять: под ним лежит прогресс всех пользователей. Номера вопросов (id) тоже не менять и не переиспользовать.
const KEY = "fizika-ekzamen-v1";
const SCHEMA = 2;
let S = {v:SCHEMA, st:{}, plan:{}};
try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); S = Object.assign(S, o); } } catch(e){}
if (!S.st || typeof S.st !== "object") S.st = {};
if (!S.plan || typeof S.plan !== "object") S.plan = {};
S.v = SCHEMA;   // сюда добавлять миграции, если формат прогресса изменится
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function exportProgress(){
  const blob = new Blob([JSON.stringify({app:"fizika-ekzamen", v:SCHEMA, saved:new Date().toISOString(), st:S.st, plan:S.plan})], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "fizika-progress-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importProgress(text){
  let o; try { o = JSON.parse(text); } catch(e){ return "Файл не похож на сохранённый прогресс."; }
  if (!o || o.app !== "fizika-ekzamen" || !o.st || typeof o.st !== "object") return "Это не файл прогресса тренажёра.";
  let n = 0;
  for (const id in o.st){
    const a = o.st[id], b = S.st[id];
    if (a && typeof a === "object" && (!b || (a.last|0) > (b.last|0))){ S.st[id] = {streak:a.streak|0, seen:a.seen|0, ok:a.ok|0, bad:a.bad|0, last:a.last||0}; n++; }
  }
  if (o.plan && typeof o.plan === "object") for (const k in o.plan) if (o.plan[k]) S.plan[k] = true;
  save(); return "Загружено вопросов: " + n + ". Более свежие записи на этом устройстве сохранены.";
}
function st(id){ return S.st[id] || (S.st[id] = {streak:0, seen:0, ok:0, bad:0, last:0}); }
function status(id){
  const s = S.st[id];
  if (!s || !s.seen) return "new";
  if (s.streak >= 2) return "done";
  if (s.streak === 1) return "learning";
  return "weak";
}
function record(id, ok){
  const s = st(id); s.seen++; s.last = Date.now();
  if (ok){ s.ok++; s.streak++; } else { s.bad++; s.streak = 0; }
  save();
}
function counts(ids){
  const c = {new:0, weak:0, learning:0, done:0};
  ids.forEach(id => c[status(id)]++);
  return c;
}

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lab(q,i){ return q.num ? String(i+1) : LET[i]; }
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function img(key, extra){ return `<div class="imgbox"><img class="qimg" alt="" data-zoom="1" src="${IMG[key]}" ${extra||""}></div>`; }
function bar(c, total){
  return `<div class="bar" aria-hidden="true"><i class="d" style="width:${pct(c.done,total)}%"></i><i class="l" style="width:${pct(c.learning,total)}%"></i><i class="w" style="width:${pct(c.weak,total)}%"></i></div>`;
}
// Формула шаблона: LaTeX; строка с "~" в начале — обычный текст с формулами в $...$
function fhtml(f){
  return f.charAt(0) === "~" ? `<div class="formula ftext tex">${esc(f.slice(1))}</div>`
                             : `<div class="formula" data-tex="${esc(f)}">${esc(f)}</div>`;
}
function tplBlock(t, open){
  return `<details class="tpl" ${open?"open":""}><summary class="tex">${esc(t.title)}</summary><div class="in">
    ${t.formulas.map(fhtml).join("")}
    <p class="rule tex">${esc(t.rule)}</p>
    <div class="qs">Вопросы: ${t.qids.join(", ")}</div></div></details>`;
}
// Текст теории: экранируем, **жирный** превращаем в <b>; формулы $...$ дорисует typeset()
function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function thFor(qid){ return Object.values(THSEC).filter(s => s.qids.includes(qid)); }
function viewTheory(){
  if (!TH.length) return `<h1>Теория</h1><p class="muted">Файл teoriya.js не найден.</p>`;
  const toc = TH.map(t => `<a class="btn small" href="#/theory/t${t.topic}">${t.topic}. ${esc(topById[t.topic].title)}</a>`).join("");
  return `<h1>Теория</h1>
  <p class="muted" style="margin:0 0 10px">Конспект по тому, что встречается в вопросах: определения, формулы, пояснения и типичные ловушки. Под каждым разделом указаны вопросы, которые на него опираются.</p>
  <div class="row toc" style="margin-bottom:6px">${toc}</div>
  ${TH.map(t => `<h2 id="th-t${t.topic}">Тема ${t.topic}. ${esc(topById[t.topic].title)}
      <a class="btn small" href="#/topic/${t.topic}" style="margin-left:8px;font-weight:400">К вопросам</a></h2>
    ${t.sections.map(s => `<details class="tpl" id="th-${s.id}" open><summary class="tex">${esc(s.title)}</summary><div class="in">
      <div class="thbody tex">${rich(s.body)}</div>
      <div class="qs">Вопросы: ${s.qids.map(id => `<a href="#" data-act="open-one" data-id="${id}">№${id}</a>`).join(", ")}</div></div></details>`).join("")}`).join("")}`;
}
// Рисуем формулы KaTeX; если библиотека не загрузилась (нет интернета), остаётся исходный текст
function typeset(){
  if (!window.katex) return;
  document.querySelectorAll("[data-tex]").forEach(el => {
    try { katex.render(el.dataset.tex, el, {displayMode:true, throwOnError:false, strict:false}); } catch(e){}
  });
  if (window.renderMathInElement) document.querySelectorAll(".tex").forEach(el => {
    try { renderMathInElement(el, {delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}], throwOnError:false, strict:false}); } catch(e){}
  });
}

/* ---------- сессия прохождения ---------- */
let R = null; // {ids,i,mode,title,picks:{},checked:{}, back}
function startRun(ids, mode, title, startAt, back){
  R = {ids, i:startAt||0, mode, title, picks:{}, checked:{}, back: back||"#/"};
  location.hash = "#/run";
  render();
}
function smartIds(n){
  const w = ORDER.filter(id => status(id)==="weak").sort((a,b)=>S.st[a].last-S.st[b].last);
  const nw = ORDER.filter(id => status(id)==="new");
  const le = ORDER.filter(id => status(id)==="learning");
  const dn = shuffle(ORDER.filter(id => status(id)==="done"));
  return w.concat(nw, le, dn).slice(0, n);
}

/* ---------- экраны ---------- */
function tabs(route){
  const items = [["#/","Главная","home"],["#/theory","Теория","theory"],["#/cheat","Шпаргалка","cheat"],["#/plan","План","plan"]];
  $("#tabs").innerHTML = items.map(([h,t,k]) => `<a href="${h}" class="${route===k?"on":""}">${t}</a>`).join("") +
    `<a href="#" id="theme" title="Тема оформления">◐</a>`;
}
function viewHome(){
  const all = ORDER, c = counts(all), N = all.length;
  const weakN = c.weak;
  return `
  ${LOADERR.length ? `<div class="note"><b>Не загружены новые вопросы из voprosy-dop.js:</b><br>${LOADERR.map(esc).join("<br>")}</div>` : ""}
  <h1>Физика: подготовка к экзамену</h1>
  <p class="muted" style="margin:0 0 14px">${N} вопросов, ${TOP.length} тем. Порядок идёт от простого к сложному, перед каждой темой есть шаблоны решений.</p>
  <div class="grid stats">
    <div class="card tile"><b>${c.done}</b><span>выучено</span></div>
    <div class="card tile"><b style="color:var(--bad)">${c.weak}</b><span>ошибки</span></div>
    <div class="card tile"><b>${c.new}</b><span>не начато</span></div>
  </div>
  <div style="margin:12px 0">${bar(c,N)}</div>
  <div class="card">
    <div class="row">
      <button class="btn primary" data-act="smart">Умное повторение · 10</button>
      <button class="btn" data-act="weak" ${weakN?"":"disabled"}>Только ошибки · ${weakN}</button>
    </div>
    <div class="row" style="margin-top:12px">
      <span class="muted">Пробный тест без подсказок:</span>
      <button class="btn small" data-act="exam" data-n="15">15</button>
      <button class="btn small" data-act="exam" data-n="30">30</button>
      <button class="btn small" data-act="exam" data-n="60">60</button>
      <button class="btn small" data-act="exam" data-n="${N}">все</button>
    </div>
    <p class="hint" style="margin-top:10px">Умное повторение берёт сначала вопросы с ошибками, потом новые, потом полуусвоенные. Вопрос считается выученным после двух верных ответов подряд.</p>
  </div>
  <h2>Темы по порядку</h2>
  <div class="grid topics">
  ${TOP.map(t => { const cc = counts(t.qids);
    return `<a class="card topic-card" href="#/topic/${t.id}">
      <div class="n">Тема ${t.id} · ${t.qids.length} вопросов</div>
      <div class="t">${esc(t.title)}</div>${bar(cc, t.qids.length)}
      <div class="hint">выучено ${cc.done} · ошибки ${cc.weak} · новых ${cc.new}</div></a>`; }).join("")}
  </div>
  <h2>Мой прогресс</h2>
  <div class="card">
    <p class="hint" style="margin-top:0">Прогресс хранится в этом браузере, обновления сайта и новые вопросы его не стирают. Если вы чистите данные браузера или меняете устройство, сохраните прогресс в файл и загрузите его на новом месте.</p>
    <div class="row">
      <button class="btn" data-act="export">Сохранить прогресс в файл</button>
      <button class="btn" data-act="import">Загрузить из файла</button>
      <input type="file" id="impfile" accept=".json,application/json" hidden>
    </div>
  </div>`;
}
function viewTopic(id){
  const t = topById[id]; if (!t) return "<p>Тема не найдена.</p>";
  const tpls = TPL.filter(x => x.topic === id);
  const c = counts(t.qids);
  return `
  <p><a href="#/">← Все темы</a></p>
  <h1>Тема ${t.id}. ${esc(t.title)}</h1>
  <p class="muted" style="margin:0 0 12px">${t.qids.length} вопросов · выучено ${c.done}, ошибки ${c.weak}, новых ${c.new}</p>
  <div class="row" style="margin-bottom:6px">
    <button class="btn primary" data-act="learn-topic" data-t="${t.id}">Учить тему по порядку</button>
    <button class="btn" data-act="exam-topic" data-t="${t.id}">Тест по теме</button>
    ${THSEC && TH.some(x => x.topic === t.id) ? `<a class="btn" href="#/theory/t${t.id}">Теория по теме</a>` : ""}
  </div>
  <h2>Шаблоны решений</h2>
  <p class="hint">Сначала прочитай шаблоны. Дальше вопросы решаются по ним.</p>
  ${tpls.map(x => tplBlock(x, true)).join("")}
  <h2>Вопросы</h2>
  <ul class="qlist">
  ${t.qids.map((qid,i) => `<li data-act="open-q" data-t="${t.id}" data-i="${i}"><span class="dot ${status(qid)}"></span><span class="no">№${qid}</span><span>${esc(byId[qid].title)}</span></li>`).join("")}
  </ul>`;
}
function viewCheat(){
  return `<h1>Шпаргалка</h1>
  <p class="muted noprint" style="margin:0 0 10px">Все шаблоны по темам. Кнопка печати разворачивает все блоки.</p>
  <div class="noprint" style="margin-bottom:8px"><button class="btn small" data-act="print">Печать / PDF</button></div>
  ${TOP.map(t => `<h2>Тема ${t.id}. ${esc(t.title)}</h2>` + TPL.filter(x=>x.topic===t.id).map(x => tplBlock(x,true)).join("")).join("")}`;
}
const PLAN = [
  ["fri","Пятница","Темы 1–5, 45 вопросов",[[1,"Кинематика"],[2,"Динамика и силы"],[3,"Работа и энергия"],[4,"Импульс и удары"],[5,"Вращение и момент импульса"]],
   "Для каждой темы: прочитать шаблоны, пройти «Учить тему», в конце вечера один раунд «Умного повторения»."],
  ["sat","Суббота","Темы 6–8, 39 вопросов",[[6,"Гармонические колебания"],[7,"Затухающие и вынужденные колебания"],[8,"Сложение колебаний и траектории"]],
   "Утром 10 минут «Только ошибки» со вчерашнего дня. Потом новые темы так же, как в пятницу."],
  ["sun","Воскресенье","Темы 9–11, 38 вопросов, потом пробный тест",[[9,"Волны"],[10,"Эффект Доплера"],[11,"Преобразования Галилея и СТО"]],
   "Вечером пробный тест на 60 вопросов без подсказок и разбор всех ошибок."],
  ["mon","Понедельник, утро","Только повторение, 30 минут",[],
   "«Только ошибки», затем шпаргалка. Новое не учить: цель — не растерять выученное."]
];
function viewPlan(){
  return `<h1>План на три дня</h1><p class="muted" style="margin:0 0 10px">Примерно 40 вопросов в день. Отмечай выполненное, галочки сохраняются.</p>` +
  PLAN.map(([k,day,sub,items,tip]) => `<div class="card" style="margin:10px 0"><h3>${day}</h3><div class="muted">${sub}</div>
    <div class="checks" style="margin-top:6px">
    ${items.map(([id,tt]) => `<label><input type="checkbox" data-plan="${k}-${id}" ${S.plan[k+"-"+id]?"checked":""}> <a href="#/topic/${id}">Тема ${id}. ${esc(tt)}</a></label>`).join("")}
    ${k==="sun" ? `<label><input type="checkbox" data-plan="sun-exam" ${S.plan["sun-exam"]?"checked":""}> Пробный тест на 60 вопросов <button class="btn small" data-act="exam" data-n="60" style="margin-left:8px">Начать</button></label>`:""}
    ${k==="mon" ? `<label><input type="checkbox" data-plan="mon-weak" ${S.plan["mon-weak"]?"checked":""}> Только ошибки <button class="btn small" data-act="weak" style="margin-left:8px">Начать</button></label>
    <label><input type="checkbox" data-plan="mon-cheat" ${S.plan["mon-cheat"]?"checked":""}> <a href="#/cheat">Шпаргалка</a></label>`:""}
    </div><p class="hint" style="margin-top:6px">${tip}</p></div>`).join("");
}
function viewRun(){
  if (!R) return viewHome();
  const id = R.ids[R.i], q = byId[id];
  const mode = R.mode, checked = R.checked[id], pick = R.picks[id] || [];
  const need = q.ans.length;
  const isText = !!q.stem;   // новый вопрос из voprosy-dop.js (текст + LaTeX); старые 122 — картинки
  let optsHtml = "";
  for (let i=0;i<q.n;i++){
    const p = i+1; let cls = "opt" + (isText ? " optrow" : "");
    if (checked){
      if (q.ans.includes(p)) cls += " ok"; else if (pick.includes(p)) cls += " bad";
    } else if (pick.includes(p)) cls += " sel";
    const inner = isText ? `<b>${lab(q,i)}</b><span class="tex">${esc(q.options[i])}</span>` : lab(q,i);
    optsHtml += `<button class="${cls}" data-act="pick" data-p="${p}" ${checked?"disabled":""}>${inner}</button>`;
  }
  const examDirect = mode === "exam";
  let after = "", verdictHtml = "";
  if (checked){
    const ok = checked === "ok";
    const right = q.ans.map(p => lab(q,p-1)).join(" и ");
    verdictHtml = `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Верно" : "Неверно. Правильный ответ: " + right}</div>`;
    if (isText){ if (q.solution) after += `<div class="solbox tex">${esc(q.solution)}</div>`; }
    else after += img("s"+q.k);
    if (q.note) after += `<div class="note tex">${esc(q.note)}</div>`;
    const ths = thFor(q.id);
    if (ths.length) after += `<div class="tplbox"><div class="h">Теория: ${ths.map(s => `<a href="#/theory/${s.id}">${esc(s.title)}</a>`).join(", ")}</div></div>`;
    q.tpl.forEach(tid => { const t = tplById[tid];
      after += `<div class="tplbox"><div class="h tex">Шаблон: ${esc(t.title)}</div>${t.formulas.map(fhtml).join("")}<div class="tex">${esc(t.rule)}</div></div>`; });
  }
  const last = R.i === R.ids.length-1;
  let btns = "";
  if (!checked){
    const label = examDirect ? (last ? "Завершить тест" : "Дальше →") : "Проверить";
    const dis = pick.length === 0 ? "disabled" : "";
    // в обучающем режиме одиночный выбор проверяется сразу, кнопка нужна только для нескольких ответов
    if (examDirect || need > 1) btns = `<button class="btn primary" data-act="${examDirect?"next":"check"}" ${dis}>${label}</button>`;
    if (examDirect) btns = `<button class="btn primary" data-act="next" ${dis}>${label}</button>`;
  } else {
    btns = `<button class="btn primary" data-act="next">${last ? "Завершить" : "Дальше →"}</button>`;
  }
  return `
  <div class="runhead">
    <div class="row"><span class="pill">${esc(R.title)}</span><span class="pill">Вопрос ${R.i+1} из ${R.ids.length}</span><span class="pill">№${q.id} · тема ${q.topic}</span></div>
    <div class="row">
      ${R.i>0 && examDirect ? `<button class="btn small" data-act="prev">← Назад</button>`:""}
      <button class="btn small" data-act="quit">Выйти</button>
    </div>
  </div>
  <div class="bar" style="margin-bottom:12px"><i class="d" style="width:${pct(R.i + (checked?1:0), R.ids.length)}%"></i></div>
  <div class="card">
    <div class="qtitle">${esc(q.title)}</div>
    ${isText ? `${q.img ? `<img class="fig" alt="" src="${esc(q.img)}">` : ""}<div class="stem tex">${esc(q.stem)}</div>` : img("q"+q.k)}
    ${isText ? (need>1 ? `<p class="hint"><b>Нужно выбрать ответов: ${need}.</b></p>` : "")
             : `<p class="hint">Нажми на картинку, чтобы изменить масштаб (на телефоне её можно листать вбок). Варианты считаются сверху вниз${q.num ? " (подписаны цифрами 1, 2, 3…)" : ""}.${need>1 ? ` <b>Нужно выбрать ответов: ${need}.</b>` : ""}</p>`}
    <div class="opts${isText ? " text" : ""}">${optsHtml}</div>
    ${verdictHtml}
    <div class="row">${btns}</div>
    ${after}
  </div>`;
}
function viewResult(res){
  const total = res.ids.length, ok = res.ok.length, bad = res.bad;
  return `<h1>Результат</h1>
  <div class="card"><div class="score">${ok} / ${total}</div><div class="muted">${pct(ok,total)}% верных</div>
  <div class="row" style="margin-top:14px">
    ${bad.length ? `<button class="btn primary" data-act="review">Разобрать ошибки · ${bad.length}</button>` : ""}
    <a class="btn" href="#/">На главную</a>
  </div></div>
  ${bad.length ? `<h2>Где ошибки</h2><ul class="qlist">${bad.map(id => `<li data-act="open-one" data-id="${id}"><span class="dot weak"></span><span class="no">№${id}</span><span>${esc(byId[id].title)}</span></li>`).join("")}</ul>` : `<p>Без ошибок. Хороший результат.</p>`}`;
}
let LASTRES = null;

/* ---------- логика проверки ---------- */
function evalQ(q, pick){
  const a = q.ans.slice().sort().join(","), b = pick.slice().sort().join(",");
  return a === b;
}
function doCheck(){
  const id = R.ids[R.i], q = byId[id], pick = R.picks[id] || [];
  if (!pick.length || R.checked[id]) return;
  const ok = evalQ(q, pick);
  R.checked[id] = ok ? "ok" : "bad";
  record(id, ok);
  render();
}
function finishExam(){
  const ok = [], bad = [];
  R.ids.forEach(id => { const q = byId[id], pick = R.picks[id] || [];
    const good = evalQ(q, pick); record(id, good); (good ? ok : bad).push(id); });
  LASTRES = {ids:R.ids, ok, bad, title:R.title};
  R = null; location.hash = "#/result"; render();
}
function next(){
  if (R.mode === "exam"){
    const id = R.ids[R.i]; if (!(R.picks[id]||[]).length) return;
    if (R.i === R.ids.length-1) return finishExam();
    R.i++; render(); return;
  }
  if (R.i === R.ids.length-1){
    const bad = R.ids.filter(id => R.checked[id]==="bad"), ok = R.ids.filter(id => R.checked[id]==="ok");
    LASTRES = {ids:R.ids, ok, bad, title:R.title}; R = null; location.hash = "#/result"; render(); return;
  }
  R.i++; render();
}
function pickOpt(p){
  const id = R.ids[R.i], q = byId[id];
  if (R.checked[id]) return;
  let cur = R.picks[id] || [];
  if (q.ans.length > 1){
    cur = cur.includes(p) ? cur.filter(x => x!==p) : cur.concat(p);
    R.picks[id] = cur; render();
  } else {
    R.picks[id] = [p];
    if (R.mode === "learn") doCheck(); else render();
  }
}

/* ---------- роутер и события ---------- */
function render(){
  const h = location.hash || "#/";
  let route = "home", html = "";
  if (h.startsWith("#/topic/")){ route = "topic"; html = viewTopic(+h.split("/")[2]); }
  else if (h === "#/run"){ route = "run"; html = viewRun(); }
  else if (h === "#/result"){ route = "result"; html = LASTRES ? viewResult(LASTRES) : viewHome(); }
  else if (h.startsWith("#/theory")){ route = "theory"; html = viewTheory(); }
  else if (h === "#/cheat"){ route = "cheat"; html = viewCheat(); }
  else if (h === "#/plan"){ route = "plan"; html = viewPlan(); }
  else html = viewHome();
  tabs(route);
  $("#app").innerHTML = html;
  typeset();
  if (route === "theory"){   // #/theory/<раздел или tN>: прокрутить к нужному месту
    const el = document.getElementById("th-" + (h.split("/")[2] || ""));
    if (el){ if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView(); return; }
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);

document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (z){ z.closest(".imgbox").classList.toggle("zoomed"); return; }
  if (e.target.id === "theme"){ e.preventDefault(); const r = document.documentElement;
    const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.setAttribute("data-theme", cur === "dark" ? "light" : "dark"); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  if (a.tagName === "A") e.preventDefault();
  const act = a.dataset.act;
  if (act === "smart") startRun(smartIds(10), "learn", "Умное повторение");
  else if (act === "weak"){ const ids = ORDER.filter(id => status(id)==="weak"); if (ids.length) startRun(ids, "learn", "Ошибки"); }
  else if (act === "exam") startRun(shuffle(ORDER).slice(0, +a.dataset.n), "exam", "Пробный тест");
  else if (act === "learn-topic"){ const t = topById[+a.dataset.t]; startRun(t.qids.slice(), "learn", "Тема "+t.id, 0); }
  else if (act === "exam-topic"){ const t = topById[+a.dataset.t]; startRun(shuffle(t.qids), "exam", "Тест: тема "+t.id); }
  else if (act === "open-q"){ const t = topById[+a.dataset.t]; startRun(t.qids.slice(), "learn", "Тема "+t.id, +a.dataset.i); }
  else if (act === "open-one"){ startRun([+a.dataset.id], "learn", "Разбор"); }
  else if (act === "review"){ startRun(LASTRES.bad.slice(), "learn", "Разбор ошибок"); }
  else if (act === "pick") pickOpt(+a.dataset.p);
  else if (act === "check") doCheck();
  else if (act === "next") next();
  else if (act === "prev"){ if (R.i>0){ R.i--; render(); } }
  else if (act === "quit"){ R = null; location.hash = "#/"; render(); }
  else if (act === "print") window.print();
  else if (act === "export") exportProgress();
  else if (act === "import"){ const f = $("#impfile"); if (f) f.click(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "impfile" && e.target.files && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { alert(importProgress(String(r.result))); render(); };
    r.readAsText(e.target.files[0]); return;
  }
  const k = e.target.dataset && e.target.dataset.plan;
  if (k){ S.plan[k] = e.target.checked; save(); }
});
document.addEventListener("keydown", e => {
  if (!R || location.hash !== "#/run" || e.metaKey || e.ctrlKey) return;
  const id = R.ids[R.i], q = byId[id];
  let idx = -1;
  if (/^[1-8]$/.test(e.key)) idx = +e.key - 1;
  else if (!q.num && /^[a-hA-H]$/.test(e.key)) idx = LET.indexOf(e.key.toLowerCase());
  if (idx >= 0 && idx < q.n){ pickOpt(idx+1); return; }
  if (e.key === "Enter" || e.key === "ArrowRight"){
    if (R.checked[id] || R.mode === "exam") next(); else if (q.ans.length > 1) doCheck();
  }
});
render();
})();
</script>
</body>
